name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Программа работает только на Windows: хранилище ключей -- DPAPI.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установка
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Линтер
        run: python -m ruff check drydock tests tools

      - name: Тесты
        run: python -m pytest -q

      - name: Словари не разошлись с кодом
        run: python tools/make_i18n.py --check
