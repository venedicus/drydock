name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows -- основная система: DPAPI, длинные пути, проводник.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      # Консоль раннера не UTF-8: без этого кириллица в выводе и в
      # дочерних процессах падает с UnicodeEncodeError.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установка
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Линтер
        run: python -m ruff check drydock tests tools

      - name: Словари не разошлись с кодом
        run: python tools/make_i18n.py --check

      - name: Ключи переводов
        run: python tools/check_keys.py

      - name: Тесты
        run: python -m pytest -q

      - name: Интерфейс в браузере
        # Горячие клавиши и браузерное меню по коду не проверить.
        run: python tools/ui_check.py

  posix:
    # macOS и Linux: приложение обещает там работать, значит это должно
    # ловиться на каждый push. Окно в CI не проверяем (нет рабочего стола),
    # но код путей, хранилища секретов и 7-Zip -- проверяем целиком.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установка
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 7-Zip
        # Без него тесты упаковки пропускаются, а проверить их надо.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          else
            brew install sevenzip
          fi

      - name: Линтер
        run: python -m ruff check drydock tests tools

      - name: Словари не разошлись с кодом
        run: python tools/make_i18n.py --check

      - name: Ключи переводов
        run: python tools/check_keys.py

      - name: Тесты
        run: python -m pytest -q

  exe:
    # Сборка одного файла проверяется на каждый push: сломанная сборка
    # должна находиться здесь, а не в день релиза.
    runs-on: windows-latest
    needs: test
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: Сборка
        run: python tools/build_exe.py

      - name: Запуск и проверка
        run: python tools/check_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: Drydock-exe
          path: dist/Drydock.exe
          if-no-files-found: error
